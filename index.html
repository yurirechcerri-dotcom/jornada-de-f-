    <script>
      // Safe LocalStorage and Process Polyfill for sandboxed iframes
      (function() {
        var isStorageSafe = false;
        try {
          var testKey = '__safe_storage_test__';
          window.localStorage.setItem(testKey, testKey);
          window.localStorage.removeItem(testKey);
          isStorageSafe = true;
        } catch (e) {
          isStorageSafe = false;
        }

        if (!isStorageSafe) {
          console.warn('window.localStorage access blocked or unavailable. Applying in-memory mock storage fallback.');
          var memoryStore = {};
          var mockStorage = {
            getItem: function(key) {
              return key in memoryStore ? memoryStore[key] : null;
            },
            setItem: function(key, value) {
              memoryStore[key] = String(value);
            },
            removeItem: function(key) {
              delete memoryStore[key];
            },
            clear: function() {
              memoryStore = {};
            },
            key: function(index) {
              var keys = Object.keys(memoryStore);
              return index < keys.length ? keys[index] : null;
            },
            get length() {
              return Object.keys(memoryStore).length;
            }
          };

          // Override both localStorage and sessionStorage on Window prototype and direct window object
          try {
            Object.defineProperty(Window.prototype, 'localStorage', {
              get: function() { return mockStorage; },
              set: function() {},
              configurable: true
            });
            Object.defineProperty(Window.prototype, 'sessionStorage', {
              get: function() { return mockStorage; },
              set: function() {},
              configurable: true
            });
          } catch (err) {
            try {
              Object.defineProperty(window, 'localStorage', {
                value: mockStorage,
                writable: true,
                configurable: true
              });
              Object.defineProperty(window, 'sessionStorage', {
                value: mockStorage,
                writable: true,
                configurable: true
              });
            } catch (err2) {
              try {
                window.localStorage = mockStorage;
                window.sessionStorage = mockStorage;
              } catch (err3) {
                console.error('Failed to inject custom localStorage fallback:', err3);
              }
            }
          }
        }
      })();

      // Clear Service Workers and Caches in Dev Sandbox immediately to avoid any white screens or stale cache loading
      (function() {
        try {
          var hostname = window.location.hostname;
          var isDevSandbox = hostname.includes('run.app') || hostname.includes('localhost') || hostname.includes('127.0.0.1');
          if (isDevSandbox) {
            if ('serviceWorker' in navigator && navigator.serviceWorker) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var i = 0; i < registrations.length; i++) {
                  registrations[i].unregister().then(function() {
                    console.log('Unregistered active Service Worker to prevent stale cache issues!');
                  });
                }
              }).catch(function(e) {});
            }

            if ('caches' in window && window.caches) {
              window.caches.keys().then(function(keys) {
                keys.forEach(function(key) {
                  window.caches.delete(key).then(function() {
                    console.log('Cleared active cache:', key);
                  });
                });
              }).catch(function(e) {});
            }
          }
        } catch (err) {
          console.warn('Sandbox cache/SW clearance bypassed:', err);
        }
      })();

      // Basic polyfill for process.env
      window.process = window.process || { env: { NODE_ENV: 'production' } };
    </script>
